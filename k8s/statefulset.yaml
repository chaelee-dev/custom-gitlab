apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab
  namespace: custom-gitlab
spec:
  serviceName: gitlab-headless
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      # hostPath 볼륨은 노드 로컬이므로 Pod을 특정 노드에 고정 — 환경의 노드 이름으로 수정
      nodeName: ai-service-master
      # 마스터 노드에 둘 경우 대비 (워커 노드면 무해)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # GitLab 정상 종료에 필요한 시간 확보
      terminationGracePeriodSeconds: 300
      containers:
        - name: gitlab
          # 태그는 kustomization.yaml의 images 변환으로 핀
          image: gitlab/gitlab-ce
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gitlab-config
            - secretRef:
                name: gitlab-secret
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab
            - name: logs
              mountPath: /var/log/gitlab
            - name: data
              mountPath: /var/opt/gitlab
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              memory: "6Gi"
          # 최초 기동은 3~10분 소요 — startupProbe로 grace period 확보
          startupProbe:
            exec:
              command:
                - /opt/gitlab/bin/gitlab-healthcheck
                - --fail
                - --max-time
                - "10"
            periodSeconds: 30
            failureThreshold: 40   # 30s * 40 = 최대 20분
          livenessProbe:
            exec:
              command:
                - /opt/gitlab/bin/gitlab-healthcheck
                - --fail
                - --max-time
                - "10"
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /opt/gitlab/bin/gitlab-healthcheck
                - --fail
                - --max-time
                - "10"
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        # hostPath 노드 로컬 디렉터리 — 없으면 kubelet이 자동 생성(DirectoryOrCreate)
        - name: config
          hostPath:
            path: /opt/custom-gitlab/config
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /opt/custom-gitlab/logs
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /opt/custom-gitlab/data
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
