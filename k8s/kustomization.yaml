apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: custom-gitlab

resources:
  - namespace.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - ingress.yaml

# latest 금지 — 고객 EKS Helm appVersion과 동일 CE 태그로 핀
images:
  - name: gitlab/gitlab-ce
    newTag: 18.11.3-ce.0
